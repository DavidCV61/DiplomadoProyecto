<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Nueva competencia</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
  <div th:replace="~{fragments/menu :: menu('competencias')}"></div>

  <main class="container mb-5" style="max-width: 800px;">
    <h1 class="h3 mb-3">Nueva competencia</h1>

    <div class="alert alert-danger" th:if="${errorGeneral}" th:text="${errorGeneral}"></div>

    <form th:action="@{/autor/competencias}" th:object="${competencia}" method="post" novalidate>
      <div class="mb-3">
        <label class="form-label fw-bold" for="nombre">Nombre</label>
        <input type="text" th:field="*{nombre}" class="form-control"
          th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
        <div class="invalid-feedback" th:errors="*{nombre}"></div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold" for="descripcion">Descripcion</label>
        <textarea th:field="*{descripcion}" rows="3" class="form-control"
          th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'"></textarea>
        <div class="invalid-feedback" th:errors="*{descripcion}"></div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold" for="fechaInicio">Inicio</label>
          <input type="datetime-local" th:field="*{fechaInicio}" class="form-control"
            th:classappend="${#fields.hasErrors('fechaInicio')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{fechaInicio}"></div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold" for="duracionMinutos">Duracion (minutos)</label>
          <input type="number" th:field="*{duracionMinutos}" class="form-control"
            th:classappend="${#fields.hasErrors('duracionMinutos')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{duracionMinutos}"></div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Problemas (solo dinamicos)</label>
        <div class="text-danger small" th:if="${#fields.hasErrors('problemaIds')}" th:errors="*{problemaIds}"></div>
        <div class="alert alert-warning" th:if="${#lists.isEmpty(problemas)}">No hay problemas dinamicos disponibles.</div>
        <div class="form-check" th:each="p : ${problemas}">
          <input class="form-check-input" type="checkbox" th:field="*{problemaIds}" th:value="${p.id}">
          <label class="form-check-label" th:for="${#ids.prev('problemaIds')}" th:text="${p.titulo}">Problema</label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Crear competencia</button>
      <a th:href="@{/competencias}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
