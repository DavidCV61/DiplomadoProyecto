<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Problema</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
  <div th:replace="~{fragments/menu :: menu('problemas')}"></div>

  <main class="container mb-5" style="max-width: 760px;">
    <h1 class="mt-3" th:text="${tituloPagina}">Problema</h1>

    <form th:action="@{${accion}}" th:object="${problema}" method="post" novalidate>
      <div class="mb-3">
        <label for="titulo" class="form-label fw-bold">Titulo</label>
        <input type="text" id="titulo" th:field="*{titulo}" class="form-control"
          th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'">
        <div class="invalid-feedback" th:errors="*{titulo}"></div>
      </div>

      <div class="mb-3">
        <label for="enunciado" class="form-label fw-bold">Enunciado</label>
        <textarea id="enunciado" th:field="*{enunciado}" rows="6" class="form-control"
          th:classappend="${#fields.hasErrors('enunciado')} ? 'is-invalid'"></textarea>
        <div class="invalid-feedback" th:errors="*{enunciado}"></div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="tema" class="form-label fw-bold">Tema</label>
          <select id="tema" th:field="*{tema}" class="form-select"
            th:classappend="${#fields.hasErrors('tema')} ? 'is-invalid'">
            <option value="">Selecciona...</option>
            <option th:each="t : ${temas}" th:value="${t.name()}" th:text="${t.etiqueta}">Tema</option>
          </select>
          <div class="invalid-feedback" th:errors="*{tema}"></div>
        </div>
        <div class="col-md-6 mb-3">
          <label for="nivel" class="form-label fw-bold">Nivel</label>
          <select id="nivel" th:field="*{nivel}" class="form-select"
            th:classappend="${#fields.hasErrors('nivel')} ? 'is-invalid'">
            <option value="">Selecciona...</option>
            <option th:each="n : ${niveles}" th:value="${n.name()}" th:text="${n.etiqueta}">Nivel</option>
          </select>
          <div class="invalid-feedback" th:errors="*{nivel}"></div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="resultadoEsperado" class="form-label fw-bold">Resultado esperado</label>
          <input type="number" step="any" id="resultadoEsperado" th:field="*{resultadoEsperado}"
            class="form-control" th:classappend="${#fields.hasErrors('resultadoEsperado')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{resultadoEsperado}"></div>
        </div>
        <div class="col-md-6 mb-3">
          <label for="margenTolerancia" class="form-label fw-bold">Margen de tolerancia</label>
          <input type="number" step="any" id="margenTolerancia" th:field="*{margenTolerancia}"
            class="form-control" th:classappend="${#fields.hasErrors('margenTolerancia')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{margenTolerancia}"></div>
        </div>
      </div>

      <div class="mb-3">
        <label for="parametrosDinamicos" class="form-label fw-bold">
          Parametros dinamicos <span class="text-muted fw-normal">(JSON, opcional)</span>
        </label>
        <textarea id="parametrosDinamicos" th:field="*{parametrosDinamicos}" rows="3"
          class="form-control font-monospace" placeholder='{"m": [1, 10], "g": 9.8}'
          th:classappend="${#fields.hasErrors('parametrosDinamicos')} ? 'is-invalid'"></textarea>
        <div class="invalid-feedback" th:errors="*{parametrosDinamicos}"></div>
      </div>

      <button type="submit" class="btn btn-primary">Guardar</button>
      <a th:href="@{/problemas}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
