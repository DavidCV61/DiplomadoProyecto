<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Competencia</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
  <div th:replace="~{fragments/menu :: menu('competencias')}"></div>

  <main class="container mb-5" style="max-width: 900px;">
    <a th:href="@{/competencias}" class="small text-decoration-none">&larr; Volver a competencias</a>

    <div class="alert alert-success mt-3" th:if="${ok}" th:text="${ok}"></div>
    <div class="alert alert-danger mt-3" th:if="${error}" th:text="${error}"></div>

    <h1 class="mt-2" th:text="${c.nombre}">Nombre</h1>
    <p>
      <span class="badge"
        th:classappend="${c.estado.name() == 'EN_CURSO'} ? 'bg-success' : (${c.estado.name() == 'PROGRAMADA'} ? 'bg-primary' : 'bg-secondary')"
        th:text="${c.estado}">Estado</span>
      <span class="text-muted small"
        th:text="'Inicio: ' + ${#temporals.format(c.fechaInicio, 'dd/MM/yyyy HH:mm')} + ' | Fin: ' + ${#temporals.format(c.fechaFin, 'dd/MM/yyyy HH:mm')} + ' | Creada por ' + ${c.creador}"></span>
    </p>
    <p th:if="${c.descripcion}" th:text="${c.descripcion}" style="white-space: pre-wrap;"></p>

    <div class="alert alert-primary" th:if="${c.estado.name() == 'PROGRAMADA'}">
      Comienza en <strong id="cuenta" th:attr="data-seg=${c.segundosParaInicio}">--:--:--</strong>
    </div>
    <div class="alert alert-success" th:if="${c.estado.name() == 'EN_CURSO'}">
      Tiempo restante: <strong id="cuenta" th:attr="data-seg=${c.segundosParaFin}">--:--:--</strong>
    </div>

    <form th:if="${c.puedeInscribirse}" th:action="@{/competencias/{id}/inscribir(id=${c.id})}" method="post" class="mb-3">
      <button type="submit" class="btn btn-primary">Inscribirme</button>
    </form>
    <p th:if="${c.inscrito}"><span class="badge bg-warning text-dark">Estas inscrito</span></p>

    <h2 class="h5 mt-4">Problemas</h2>
    <table class="table align-middle">
      <thead>
        <tr><th>#</th><th>Titulo</th><th>Estado</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="p : ${c.problemas}">
          <td th:text="${p.orden}">1</td>
          <td th:text="${p.titulo}">Titulo</td>
          <td>
            <span class="badge bg-success" th:if="${p.resuelto}">Resuelto</span>
          </td>
          <td>
            <a class="btn btn-sm btn-outline-primary"
              th:if="${c.estado.name() == 'EN_CURSO' and c.inscrito and !p.resuelto}"
              th:href="@{/competencias/{cid}/problemas/{pid}/resolver(cid=${c.id},pid=${p.id})}">Resolver</a>
          </td>
        </tr>
      </tbody>
    </table>

    <h2 class="h5 mt-4">Tabla de posiciones</h2>
    <p class="text-muted small" th:if="${#lists.isEmpty(c.tabla)}">Aun no hay envios.</p>
    <table class="table table-sm" th:unless="${#lists.isEmpty(c.tabla)}">
      <thead>
        <tr>
          <th>Pos.</th><th>Usuario</th><th>Resueltos</th><th>Tiempo (s)</th><th>Intentos</th>
          <th th:if="${c.estado.name() == 'FINALIZADA'}">Elo</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="f : ${c.tabla}">
          <td th:text="${f.posicion}">1</td>
          <td th:text="${f.username}">user</td>
          <td th:text="${f.puntuacion}">0</td>
          <td th:text="${f.tiempoSegundos}">0</td>
          <td th:text="${f.intentos}">0</td>
          <td th:if="${c.estado.name() == 'FINALIZADA'}"
            th:text="${f.eloAntes} + ' → ' + ${f.eloDespues} + ' (' + (${f.cambioElo} >= 0 ? '+' : '') + ${f.cambioElo} + ')'">1000</td>
        </tr>
      </tbody>
    </table>
  </main>

  <script>
    (function () {
      var el = document.getElementById('cuenta');
      if (!el) { return; }
      var s = parseInt(el.getAttribute('data-seg'), 10);
      function fmt(n) {
        var h = Math.floor(n / 3600), m = Math.floor((n % 3600) / 60), x = n % 60;
        return [h, m, x].map(function (v) { return String(v).padStart(2, '0'); }).join(':');
      }
      el.textContent = fmt(s);
      setInterval(function () {
        s--;
        if (s <= 0) { location.reload(); return; }
        el.textContent = fmt(s);
      }, 1000);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
