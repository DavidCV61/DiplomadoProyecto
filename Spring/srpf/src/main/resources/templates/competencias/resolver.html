<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Competencia</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
  <div th:replace="~{fragments/menu :: menu('competencias')}"></div>

  <main class="container mb-5" style="max-width: 800px;">
    <a th:href="@{/competencias/{id}(id=${cid})}" class="small text-decoration-none">&larr; Volver a la competencia</a>

    <div class="alert alert-secondary mt-3 d-flex justify-content-between">
      <span>Tiempo restante</span>
      <strong id="cuenta" th:attr="data-seg=${restante}">--:--:--</strong>
    </div>

    <h1 class="mt-2" th:text="${preparado.titulo}">Titulo</h1>
    <p>
      <span class="badge bg-info text-dark" th:text="${preparado.tema.etiqueta}">Tema</span>
      <span class="badge bg-secondary" th:text="${preparado.nivel.etiqueta}">Nivel</span>
    </p>

    <div class="alert alert-danger" th:if="${resultado == 'mal'}">
      Incorrecto. Se generaron valores nuevos, intenta de nuevo.
    </div>

    <div class="card mb-3">
      <div class="card-body" style="white-space: pre-wrap;" th:text="${preparado.enunciado}">Enunciado</div>
    </div>

    <form th:action="@{/competencias/{cid}/problemas/{pid}/resolver(cid=${cid},pid=${preparado.problemaId})}"
      th:object="${respuesta}" method="post" novalidate>
      <div class="mb-3">
        <label for="respuesta" class="form-label fw-bold">Tu respuesta</label>
        <input type="number" step="any" th:field="*{respuesta}" class="form-control"
          th:classappend="${#fields.hasErrors('respuesta')} ? 'is-invalid'">
        <div class="invalid-feedback" th:errors="*{respuesta}"></div>
      </div>
      <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
  </main>

  <script>
    (function () {
      var el = document.getElementById('cuenta');
      var s = parseInt(el.getAttribute('data-seg'), 10);
      function fmt(n) {
        var h = Math.floor(n / 3600), m = Math.floor((n % 3600) / 60), x = n % 60;
        return [h, m, x].map(function (v) { return String(v).padStart(2, '0'); }).join(':');
      }
      el.textContent = fmt(s);
      setInterval(function () {
        s--;
        if (s <= 0) { window.location.href = window.location.pathname.replace(/\/problemas\/.*$/, ''); return; }
        el.textContent = fmt(s);
      }, 1000);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
