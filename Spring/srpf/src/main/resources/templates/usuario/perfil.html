<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
  lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Mi Perfil</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>

<body class="bg-light">
  <div th:replace="~{fragments/menu :: menu('perfil')}"></div>
  <main class="container my-4">
    <div class="card shadow-sm border-0 p-4">
      <h3 class="fw-bold mb-3">Tu perfil</h3>
      <p>Nombre: <strong th:text="${perfil.nombre}">-</strong></p>
      <p>Usuario: <strong class="text-primary" th:text="${perfil.username}">-</strong></p>
      <p>Correo: <span th:text="${perfil.email}">-</span></p>
      <p>Rol: <span class="badge bg-secondary" th:text="${perfil.rol}">-</span></p>
      <p>Puntuacion ELO: <strong th:text="${perfil.puntuacionElo}">1000</strong></p>
      <p>Miembro desde:
        <span th:text="${#temporals.format(perfil.fechaRegistro, 'dd/MM/yyyy HH:mm')}">-</span>
      </p>
      <hr>
      <p class="text-muted">Espacio para estadisticas individuales de resolucion y ranking.</p>
    </div>
  </main>
  <div th:replace="~{fragments/footer :: footer}"></div>
  <div th:replace="~{fragments/scripts :: bootstrap-js}"></div>
</body>

</html>
