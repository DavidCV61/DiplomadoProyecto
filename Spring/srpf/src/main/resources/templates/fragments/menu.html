<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-2 shadow-sm" th:fragment="menu(active)">
    <div class="container">
      <a class="navbar-brand fw-bold text-warning me-4" th:href="@{/}">SRPF</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link px-2" th:classappend="${active == 'inicio'} ? 'active fw-bold text-warning' : ''"
              th:href="@{/}">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-2" th:classappend="${active == 'problemas'} ? 'active fw-bold text-warning' : ''"
              th:href="@{/problemas}">Problemas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-2" th:classappend="${active == 'ranking'} ? 'active fw-bold text-warning' : ''"
              th:href="@{/ranking}">Ranking</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-2" th:classappend="${active == 'competencias'} ? 'active fw-bold text-warning' : ''"
              th:href="@{/competencias}">Competencias</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-2" th:classappend="${active == 'enviados'} ? 'active fw-bold text-warning' : ''"
              th:href="@{/enviados}">Enviados</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-2" th:classappend="${active == 'foro'} ? 'active fw-bold text-warning' : ''"
              th:href="@{/foro}">Foro</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-2" th:classappend="${active == 'perfiles'} ? 'active fw-bold text-warning' : ''"
              th:href="@{/usuarios}">Perfiles</a>
          </li>
          <li class="nav-item" sec:authorize="isAuthenticated()">
            <a class="nav-link px-2" th:classappend="${active == 'mensajes'} ? 'active fw-bold text-warning' : ''"
              th:href="@{/mensajes}">Mensajes</a>
          </li>

          <!-- Solo AUTOR y ADMIN -->
          <li class="nav-item dropdown" sec:authorize="hasAnyRole('AUTOR','ADMIN')">
            <a class="nav-link dropdown-toggle px-2" href="#" id="autorDropdown" role="button" data-bs-toggle="dropdown"
              aria-expanded="false">
              Autor
            </a>
            <ul class="dropdown-menu dropdown-menu-dark shadow" aria-labelledby="autorDropdown">
              <li><a class="dropdown-item" th:href="@{/autor/problemas/nuevo}">Crear Problema</a></li>
              <li><a class="dropdown-item" th:href="@{/autor/competencias/nueva}">Crear Competencia</a></li>
            </ul>
          </li>

          <!-- Solo ADMIN -->
          <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link dropdown-toggle px-2" href="#" id="adminDropdown" role="button" data-bs-toggle="dropdown"
              aria-expanded="false">
              Administracion
            </a>
            <ul class="dropdown-menu dropdown-menu-dark shadow" aria-labelledby="adminDropdown">
              <li><a class="dropdown-item" th:href="@{/admin/usuarios}">Gestion de Usuarios</a></li>
            </ul>
          </li>
        </ul>

        <div class="d-flex align-items-center">
          <!-- Usuario autenticado -->
          <div sec:authorize="isAuthenticated()" class="dropdown">
            <button class="btn btn-outline-light btn-sm dropdown-toggle px-3" type="button" id="userMenu"
              data-bs-toggle="dropdown" aria-expanded="false">
              <span sec:authentication="principal.name">Usuario</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow mt-2" aria-labelledby="userMenu">
              <li>
                <h6 class="dropdown-header">Cuenta activa</h6>
              </li>
              <li><a class="dropdown-item" th:href="@{/perfil}">Mi Perfil</a></li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li>
                <form th:action="@{/doLogout}" method="post" class="px-2 m-0">
                  <button type="submit" class="btn btn-outline-danger btn-sm w-100">Cerrar Sesion</button>
                </form>
              </li>
            </ul>
          </div>

          <!-- Visitante -->
          <div sec:authorize="isAnonymous()" class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm px-3" th:href="@{/registro}">Registrarse</a>
            <a class="btn btn-outline-warning btn-sm px-3" th:href="@{/login}">Iniciar Sesion</a>
          </div>
        </div>
      </div>
    </div>
  </nav>
</body>

</html>
