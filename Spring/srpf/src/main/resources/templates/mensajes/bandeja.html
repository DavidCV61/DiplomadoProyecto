<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Mensajes</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body class="d-flex flex-column min-vh-100">
  <div th:replace="~{fragments/menu :: menu('mensajes')}"></div>

  <main class="container mb-5">
    <h1 class="mt-3">Mensajes</h1>
    <p class="text-muted">Para escribirle a alguien, entra a su perfil desde <a th:href="@{/usuarios}">Perfiles</a>.</p>

    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>Fecha</th>
          <th></th>
          <th>Usuario</th>
          <th>Mensaje</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(mensajes)}">
          <td colspan="4" class="text-center text-muted py-4">No tienes mensajes.</td>
        </tr>
        <tr th:each="m : ${mensajes}"
          th:with="mio=${m.remitenteUsername == #authentication.principal.username},otro=${mio ? m.destinatarioUsername : m.remitenteUsername},otroNombre=${mio ? m.destinatarioNombre : m.remitenteNombre}">
          <td th:text="${#temporals.format(m.fecha, 'dd/MM/yyyy HH:mm')}">fecha</td>
          <td>
            <span class="badge" th:classappend="${mio} ? 'bg-secondary' : 'bg-success'"
              th:text="${mio} ? 'Enviado' : 'Recibido'">Recibido</span>
          </td>
          <td>
            <a th:href="@{/usuarios/{n}(n=${otro})}" class="text-decoration-none"
              th:text="${otroNombre}">Usuario</a>
          </td>
          <td style="white-space: pre-wrap;" th:text="${m.contenido}">Contenido</td>
        </tr>
      </tbody>
    </table>
  </main>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
