<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Registro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-dark d-flex align-items-center justify-content-center py-4" style="min-height: 100vh;">
  <div class="card shadow-lg border-0" style="width: 26rem; border-radius: 12px;">
    <div class="card-body p-4">
      <h3 class="text-center fw-bold mb-1 text-primary">SRPF</h3>
      <p class="text-center text-muted small mb-3">Crear cuenta</p>

      <form th:action="@{/registro}" th:object="${registro}" method="post" novalidate>
        <div class="mb-3">
          <label for="nombre" class="form-label small fw-bold">Nombre</label>
          <input type="text" id="nombre" th:field="*{nombre}" class="form-control"
            th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" autofocus>
          <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
          <label for="username" class="form-label small fw-bold">Usuario</label>
          <input type="text" id="username" th:field="*{username}" class="form-control"
            th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{username}"></div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label small fw-bold">Correo electronico</label>
          <input type="email" id="email" th:field="*{email}" class="form-control"
            th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label small fw-bold">Contrasena</label>
          <input type="password" id="password" th:field="*{password}" class="form-control"
            th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{password}"></div>
        </div>

        <div class="mb-3">
          <label for="confirmarPassword" class="form-label small fw-bold">Confirmar contrasena</label>
          <input type="password" id="confirmarPassword" th:field="*{confirmarPassword}" class="form-control"
            th:classappend="${#fields.hasErrors('confirmarPassword')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{confirmarPassword}"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Registrarme</button>
      </form>

      <div class="text-center mt-3">
        <a th:href="@{/login}" class="text-decoration-none small text-secondary">¿Ya tienes cuenta? Inicia sesion</a>
      </div>
      <div class="text-center mt-1">
        <a th:href="@{/}" class="text-decoration-none small text-secondary">&larr; Volver al inicio</a>
      </div>
    </div>
  </div>
</body>

</html>
