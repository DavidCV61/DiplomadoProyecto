<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Ranking</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
  <div th:replace="~{fragments/menu :: menu('ranking')}"></div>

  <main class="container mb-5">
    <h1 class="mt-3">Ranking</h1>

    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th style="width: 80px;">#</th>
          <th>Usuario</th>
          <th>Elo</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(ranking)}">
          <td colspan="3" class="text-center text-muted py-4">Aun no hay usuarios.</td>
        </tr>
        <tr th:each="r : ${ranking}">
          <td class="fw-bold" th:text="${r.posicion}">1</td>
          <td>
            <span th:text="${r.nombre}">Nombre</span>
            <span class="text-muted small" th:text="'@' + ${r.username}">@usuario</span>
          </td>
          <td th:text="${r.elo}">1000</td>
        </tr>
      </tbody>
    </table>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
