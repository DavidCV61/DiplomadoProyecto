<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Iniciar Sesion</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>

<body class="bg-dark d-flex align-items-center justify-content-center" style="height: 100vh;">
  <div class="card shadow-lg border-0" style="width: 23rem; border-radius: 12px;">
    <div class="card-body p-4">
      <h3 class="text-center fw-bold mb-1 text-primary">SRPF</h3>
      <p class="text-center text-muted small mb-3">Autenticacion de Usuarios</p>

      <div th:if="${param.error}" class="alert alert-danger py-2 small text-center">
        Usuario o contrasena invalidos.
      </div>
      <div th:if="${param.logout}" class="alert alert-success py-2 small text-center">
        Sesion cerrada correctamente.
      </div>

      <div th:if="${param.registrado}" class="alert alert-success py-2 small text-center">
        Cuenta creada. Ya puedes iniciar sesion.
      </div>

      <form method="post" th:action="@{/login}">
        <div class="mb-3">
          <label for="username" class="form-label small fw-bold">Usuario</label>
          <input type="text" id="username" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label small fw-bold">Contrasena</label>
          <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Entrar</button>
      </form>

      <div class="text-center mt-3">
        <a th:href="@{/}" class="text-decoration-none small text-secondary">&larr; Volver al inicio</a>
      </div>
    </div>
  </div>
</body>

</html>
