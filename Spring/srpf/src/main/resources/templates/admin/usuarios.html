<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Usuarios</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
  <div th:replace="~{fragments/menu :: menu('admin')}"></div>

  <main class="container mb-5">
    <h1 class="mt-3">Gestion de usuarios</h1>
    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Usuario</th>
          <th>Correo</th>
          <th>Elo</th>
          <th>Registro</th>
          <th>Rol</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="u : ${usuarios}">
          <td th:text="${u.id}">1</td>
          <td th:text="${u.nombre}">Nombre</td>
          <td th:text="${u.username}">usuario</td>
          <td th:text="${u.email}">correo</td>
          <td th:text="${u.puntuacionElo}">1000</td>
          <td th:text="${#temporals.format(u.fechaRegistro, 'dd/MM/yyyy HH:mm')}">fecha</td>
          <td>
            <span th:if="${u.id == #authentication.principal.id}" class="badge bg-dark"
              th:text="${u.rol.name()} + ' (tu)'">ADMIN</span>
            <form th:unless="${u.id == #authentication.principal.id}"
              th:action="@{/admin/usuarios/{id}/rol(id=${u.id})}" method="post"
              class="d-flex gap-2 m-0">
              <select name="rol" class="form-select form-select-sm" style="width: 120px;">
                <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.name()}"
                  th:selected="${r == u.rol}">USER</option>
              </select>
              <button type="submit" class="btn btn-sm btn-primary">Guardar</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
