<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Foro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
  <div th:replace="~{fragments/menu :: menu('foro')}"></div>

  <main class="container mb-5">
    <div class="d-flex justify-content-between align-items-center mt-3 mb-3">
      <h1 class="m-0">Foro</h1>
      <a th:href="@{/foro/nueva}" class="btn btn-success">Nueva publicacion</a>
    </div>

    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-secondary" th:if="${#lists.isEmpty(publicaciones)}">
      Aun no hay publicaciones.
    </div>

    <div class="list-group">
      <a th:each="p : ${publicaciones}" th:href="@{/foro/{id}(id=${p.id})}"
        class="list-group-item list-group-item-action">
        <div class="d-flex justify-content-between">
          <h5 class="mb-1" th:text="${p.titulo}">Titulo</h5>
          <small class="text-muted" th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy HH:mm')}">fecha</small>
        </div>
        <small class="text-muted">
          por <span th:text="${p.autorNombre}">Autor</span>
          &middot; <span th:text="${p.respuestas}">0</span> respuestas
        </small>
      </a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
