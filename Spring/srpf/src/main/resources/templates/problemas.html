<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Problemas</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body class="d-flex flex-column min-vh-100">
  <div th:replace="~{fragments/menu :: menu('problemas')}"></div>

  <main class="container mb-5">
    <h1 class="mt-3">Problemas</h1>
    <div class="alert alert-success" th:if="${guardado}">Problema guardado correctamente.</div>
    <div class="alert alert-success" th:if="${actualizado}">Problema actualizado correctamente.</div>
    <p class="text-muted">Da clic en un problema para verlo y resolverlo.</p>

    <form th:action="@{/problemas}" method="get" class="row g-2 align-items-end mb-3">
      <div class="col-sm-4 col-md-3">
        <label for="tema" class="form-label small fw-bold mb-1">Tema</label>
        <select id="tema" name="tema" class="form-select">
          <option value="">Todos</option>
          <option th:each="t : ${temas}" th:value="${t.name()}" th:text="${t.etiqueta}"
            th:selected="${t == temaSel}">Tema</option>
        </select>
      </div>
      <div class="col-sm-4 col-md-3">
        <label for="nivel" class="form-label small fw-bold mb-1">Nivel</label>
        <select id="nivel" name="nivel" class="form-select">
          <option value="">Todos</option>
          <option th:each="n : ${niveles}" th:value="${n.name()}" th:text="${n.etiqueta}"
            th:selected="${n == nivelSel}">Nivel</option>
        </select>
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-primary">Filtrar</button>
        <a th:href="@{/problemas}" class="btn btn-outline-secondary">Limpiar</a>
      </div>
      <div class="col text-end" sec:authorize="hasAnyRole('AUTOR','ADMIN')">
        <a th:href="@{/autor/problemas/nuevo}" class="btn btn-success">Nuevo Problema</a>
      </div>
    </form>

    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>Título</th>
          <th>Tema</th>
          <th>Nivel</th>
          <th>Autor</th>
          <th>Operaciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(problemas)}">
          <td colspan="5" class="text-center text-muted py-4">No hay problemas con esos filtros.</td>
        </tr>
        <tr th:each="problema : ${problemas}">
          <td>
            <a th:href="@{/problemas/{id}(id=${problema.id})}" class="fw-bold text-decoration-none"
              th:text="${problema.titulo}">Título</a>
          </td>
          <td><span class="badge bg-info text-dark" th:text="${problema.tema.etiqueta}">Tema</span></td>
          <td><span class="badge bg-secondary" th:text="${problema.nivel.etiqueta}">Nivel</span></td>
          <td class="small" th:text="${problema.autor.nombre}">Autor</td>
          <td>
            <a th:href="@{/problemas/{id}(id=${problema.id})}" class="btn btn-primary btn-sm">Ver</a>
            <th:block th:if="${#authorization.expression('hasRole(''ADMIN'')')
                or (#authorization.expression('hasRole(''AUTOR'')')
                    and problema.autor.id == #authentication.principal.id)}">
              <a th:href="@{/autor/problemas/{id}/editar(id=${problema.id})}"
                class="btn btn-warning btn-sm">Editar</a>
            </th:block>
          </td>
        </tr>
      </tbody>
    </table>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
