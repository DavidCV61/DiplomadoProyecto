<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Resolver</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body class="d-flex flex-column min-vh-100">
  <div th:replace="~{fragments/menu :: menu('problemas')}"></div>

  <main class="container mb-5" style="max-width: 800px;">
    <a th:href="@{/problemas}" class="small text-decoration-none">&larr; Volver a problemas</a>

    <div class="alert alert-danger mt-3" th:if="${errorProblema}" th:text="${errorProblema}"></div>

    <th:block th:if="${preparado != null}">
      <h1 class="mt-2" th:text="${preparado.titulo}">Titulo</h1>
      <p>
        <span class="badge bg-info text-dark" th:text="${preparado.tema.etiqueta}">Tema</span>
        <span class="badge bg-secondary" th:text="${preparado.nivel.etiqueta}">Nivel</span>
      </p>

      <div class="alert alert-success" th:if="${resultado == 'ok'}">
        Correcto. Tu intento quedo registrado.
      </div>
      <div class="alert alert-danger" th:if="${resultado == 'mal'}">
        Incorrecto. Se generaron valores nuevos, intenta de nuevo.
      </div>

      <div class="card mb-3">
        <div class="card-body" style="white-space: pre-wrap;" th:text="${preparado.enunciado}">Enunciado</div>
      </div>

      <form th:action="@{/problemas/{id}/resolver(id=${preparado.problemaId})}" th:object="${respuesta}"
        method="post" novalidate>
        <div class="mb-3">
          <label for="respuesta" class="form-label fw-bold">Tu respuesta</label>
          <input type="number" step="any" th:field="*{respuesta}" class="form-control"
            th:classappend="${#fields.hasErrors('respuesta')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{respuesta}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Enviar</button>
        <a th:href="@{/enviados}" class="btn btn-outline-secondary">Mis envios</a>
      </form>
    </th:block>
  </main>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
