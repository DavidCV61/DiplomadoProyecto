<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Problema</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body class="d-flex flex-column min-vh-100">
  <div th:replace="~{fragments/menu :: menu('problemas')}"></div>

  <main class="container mb-5" style="max-width: 800px;">
    <a th:href="@{/problemas}" class="small text-decoration-none">&larr; Volver a problemas</a>
    <h1 class="mt-2" th:text="${problema.titulo}">Titulo</h1>

    <p>
      <span class="badge bg-info text-dark" th:text="${problema.tema.etiqueta}">Tema</span>
      <span class="badge bg-secondary" th:text="${problema.nivel.etiqueta}">Nivel</span>
      <span class="text-muted small ms-2">
        por <span th:text="${problema.autorNombre}">Autor</span>
        &middot; <span th:text="${#temporals.format(problema.fechaCreacion, 'dd/MM/yyyy HH:mm')}">fecha</span>
      </span>
    </p>

    <div class="card mb-3">
      <div class="card-body" style="white-space: pre-wrap;" th:text="${problema.enunciado}">Enunciado</div>
    </div>

    <a th:if="${puedeEditar}" th:href="@{/autor/problemas/{id}/editar(id=${problema.id})}"
      class="btn btn-warning">Editar</a>
    <a th:href="@{/problemas/{id}/resolver(id=${problema.id})}" class="btn btn-primary">Resolver</a>
  </main>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
