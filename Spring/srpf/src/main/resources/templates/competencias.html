<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Competencias</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body class="d-flex flex-column min-vh-100">
  <div th:replace="~{fragments/menu :: menu('competencias')}"></div>

  <main class="container mb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Competencias</h1>
      <a th:if="${puedeCrear}" th:href="@{/autor/competencias/nueva}" class="btn btn-primary btn-sm">Nueva competencia</a>
    </div>

    <div class="alert alert-success" th:if="${ok}" th:text="${ok}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="alert alert-info" th:if="${#lists.isEmpty(competencias)}">Aun no hay competencias.</div>

    <table class="table table-hover align-middle" th:unless="${#lists.isEmpty(competencias)}">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Estado</th>
          <th>Inicio</th>
          <th>Duracion</th>
          <th>Participantes</th>
          <th>Creador</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="c : ${competencias}">
          <td><a th:href="@{/competencias/{id}(id=${c.id})}" th:text="${c.nombre}">Nombre</a></td>
          <td>
            <span class="badge"
              th:classappend="${c.estado.name() == 'EN_CURSO'} ? 'bg-success' : (${c.estado.name() == 'PROGRAMADA'} ? 'bg-primary' : 'bg-secondary')"
              th:text="${c.estado}">Estado</span>
          </td>
          <td th:text="${#temporals.format(c.fechaInicio, 'dd/MM/yyyy HH:mm')}">Inicio</td>
          <td th:text="${c.duracionMinutos} + ' min'">60 min</td>
          <td th:text="${c.participantes}">0</td>
          <td th:text="${c.creador}">autor</td>
          <td><span class="badge bg-warning text-dark" th:if="${c.inscrito}">Inscrito</span></td>
        </tr>
      </tbody>
    </table>
  </main>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
