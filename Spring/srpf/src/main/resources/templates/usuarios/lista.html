<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Perfiles</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
  <div th:replace="~{fragments/menu :: menu('perfiles')}"></div>

  <main class="container mb-5">
    <h1 class="mt-3">Perfiles</h1>
    <p class="text-muted">Busca usuarios por nombre o nombre de usuario.</p>

    <form th:action="@{/usuarios}" method="get" class="row g-2 mb-3">
      <div class="col-sm-8 col-md-6">
        <input type="text" name="q" th:value="${q}" class="form-control" placeholder="Buscar..." autofocus>
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-primary">Buscar</button>
        <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Limpiar</a>
      </div>
    </form>

    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>Nombre</th>
          <th>Usuario</th>
          <th>Elo</th>
          <th>Problemas resueltos</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(usuarios)}">
          <td colspan="5" class="text-center text-muted py-4">No se encontraron usuarios.</td>
        </tr>
        <tr th:each="u : ${usuarios}">
          <td>
            <a th:href="@{/usuarios/{n}(n=${u.username})}" class="fw-bold text-decoration-none"
              th:text="${u.nombre}">Nombre</a>
          </td>
          <td class="text-muted" th:text="'@' + ${u.username}">@usuario</td>
          <td th:text="${u.elo}">1000</td>
          <td th:text="${u.resueltos}">0</td>
          <td>
            <a th:href="@{/usuarios/{n}(n=${u.username})}" class="btn btn-primary btn-sm">Ver perfil</a>
          </td>
        </tr>
      </tbody>
    </table>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
