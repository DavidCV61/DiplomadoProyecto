<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Perfil</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <style>
    .perfil-card { border: 1px solid #eef0f3; border-radius: 1rem; box-shadow: 0 6px 24px rgba(33, 37, 41, .06); }
    .perfil-avatar { width: 64px; height: 64px; border-radius: 1rem; display: flex; align-items: center;
      justify-content: center; font-size: 1.6rem; font-weight: 800; color: #3b2a00;
      background: linear-gradient(135deg, #ffd24a, #ff9f1c); box-shadow: 0 4px 12px rgba(255, 159, 28, .35); }
    .perfil-stat { background: #fafbfc; border: 1px solid #eef0f3; border-radius: .85rem; padding: 1rem; text-align: center; }
    .perfil-stat .label { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: #6c757d; }
    .perfil-stat .valor { font-size: 1.9rem; font-weight: 800; line-height: 1.2; }
    .perfil-info { background: #fafbfc; border: 1px solid #eef0f3; border-radius: .85rem; }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">
  <div th:replace="~{fragments/menu :: menu('perfiles')}"></div>

  <main class="container mb-5" style="max-width: 800px;">
    <a th:href="@{/usuarios}" class="small text-decoration-none">&larr; Volver a perfiles</a>
    <div class="alert alert-success mt-2" th:if="${enviado}">Mensaje enviado.</div>

    <div class="card perfil-card mt-3 mb-4">
      <div class="card-body p-4">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
          <div class="d-flex align-items-center gap-3">
            <div>
              <h2 class="h4 fw-bold mb-0" th:text="${perfil.nombre}">Nombre</h2>
              <div class="text-muted" th:text="'@' + ${perfil.username}">@usuario</div>
            </div>
          </div>
          <span class="badge rounded-pill bg-warning-subtle text-warning-emphasis border border-warning-subtle px-3 py-2"
            th:text="${perfil.rol}">USER</span>
        </div>

        <hr class="my-4 text-secondary opacity-25">

        <div class="row g-3">
          <div class="col-12 col-md-4">
            <div class="perfil-stat">
              <div class="label">Puntuación Elo</div>
              <div class="valor" style="color:#d39e00" th:text="${perfil.elo}">1000</div>
            </div>
          </div>
          <div class="col-6 col-md-4">
            <div class="perfil-stat">
              <div class="label">Problemas resueltos</div>
              <div class="valor text-success" th:text="${perfil.resueltos}">0</div>
            </div>
          </div>
          <div class="col-6 col-md-4">
            <div class="perfil-stat">
              <div class="label">Intentos</div>
              <div class="valor text-primary" th:text="${perfil.intentos}">0</div>
            </div>
          </div>
        </div>

        <div class="perfil-info mt-3 px-3 py-2 small text-muted">
          Miembro desde:
          <strong class="text-dark" th:text="${#temporals.format(perfil.fechaRegistro, 'dd/MM/yyyy HH:mm')}">fecha</strong>
        </div>
      </div>
    </div>

    <div th:if="${esYo}" class="alert alert-info">
      Este es tu perfil. Tus conversaciones estan en <a th:href="@{/mensajes}">Mensajes</a>.
    </div>

    <th:block th:unless="${esYo}">
      <h5>Conversacion</h5>
      <div class="alert alert-secondary" th:if="${#lists.isEmpty(conversacion)}">
        Aun no hay mensajes con este usuario.
      </div>
      <div th:each="m : ${conversacion}" class="card mb-2"
        th:classappend="${m.remitenteUsername == perfil.username} ? 'border-primary' : ''">
        <div class="card-body py-2">
          <div class="small text-muted">
            <strong th:text="${m.remitenteUsername == perfil.username} ? ${m.remitenteNombre} : 'Tu'">Autor</strong>
            &middot; <span th:text="${#temporals.format(m.fecha, 'dd/MM/yyyy HH:mm')}">fecha</span>
          </div>
          <div style="white-space: pre-wrap;" th:text="${m.contenido}">Contenido</div>
        </div>
      </div>

      <h5 class="mt-4">Enviar mensaje</h5>
      <form th:action="@{/usuarios/{n}/mensajes(n=${perfil.username})}" th:object="${mensajeForm}"
        method="post" novalidate>
        <div class="mb-3">
          <textarea th:field="*{contenido}" rows="3" class="form-control"
            placeholder="Escribe tu mensaje..."
            th:classappend="${#fields.hasErrors('contenido')} ? 'is-invalid'"></textarea>
          <div class="invalid-feedback" th:errors="*{contenido}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Enviar</button>
      </form>
    </th:block>
  </main>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
