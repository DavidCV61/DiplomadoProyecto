<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Perfil</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
  <div th:replace="~{fragments/menu :: menu('perfiles')}"></div>

  <main class="container mb-5" style="max-width: 800px;">
    <a th:href="@{/usuarios}" class="small text-decoration-none">&larr; Volver a perfiles</a>
    <div class="alert alert-success mt-2" th:if="${enviado}">Mensaje enviado.</div>

    <div class="card mt-3 mb-4">
      <div class="card-body">
        <h2 class="mb-0" th:text="${perfil.nombre}">Nombre</h2>
        <p class="text-muted">
          <span th:text="'@' + ${perfil.username}">@usuario</span>
          <span class="badge bg-dark ms-2" th:text="${perfil.rol}">USER</span>
        </p>
        <div class="row text-center">
          <div class="col-6 col-md-3 mb-2">
            <div class="fs-4 fw-bold" th:text="${perfil.elo}">1000</div>
            <div class="small text-muted">Elo</div>
          </div>
          <div class="col-6 col-md-3 mb-2">
            <div class="fs-4 fw-bold" th:text="${perfil.resueltos}">0</div>
            <div class="small text-muted">Problemas resueltos</div>
          </div>
          <div class="col-6 col-md-3 mb-2">
            <div class="fs-4 fw-bold" th:text="${perfil.intentos}">0</div>
            <div class="small text-muted">Intentos</div>
          </div>
          <div class="col-6 col-md-3 mb-2">
            <div class="fs-6 fw-bold" th:text="${#temporals.format(perfil.fechaRegistro, 'dd/MM/yyyy')}">fecha</div>
            <div class="small text-muted">Miembro desde</div>
          </div>
        </div>
      </div>
    </div>

    <div th:if="${esYo}" class="alert alert-info">
      Este es tu perfil. Tus conversaciones estan en <a th:href="@{/mensajes}">Mensajes</a>.
    </div>

    <th:block th:unless="${esYo}">
      <h5>Conversacion</h5>
      <div class="alert alert-secondary" th:if="${#lists.isEmpty(conversacion)}">
        Aun no hay mensajes con este usuario.
      </div>
      <div th:each="m : ${conversacion}" class="card mb-2"
        th:classappend="${m.remitenteUsername == perfil.username} ? 'border-primary' : ''">
        <div class="card-body py-2">
          <div class="small text-muted">
            <strong th:text="${m.remitenteUsername == perfil.username} ? ${m.remitenteNombre} : 'Tu'">Autor</strong>
            &middot; <span th:text="${#temporals.format(m.fecha, 'dd/MM/yyyy HH:mm')}">fecha</span>
          </div>
          <div style="white-space: pre-wrap;" th:text="${m.contenido}">Contenido</div>
        </div>
      </div>

      <h5 class="mt-4">Enviar mensaje</h5>
      <form th:action="@{/usuarios/{n}/mensajes(n=${perfil.username})}" th:object="${mensajeForm}"
        method="post" novalidate>
        <div class="mb-3">
          <textarea th:field="*{contenido}" rows="3" class="form-control"
            placeholder="Escribe tu mensaje..."
            th:classappend="${#fields.hasErrors('contenido')} ? 'is-invalid'"></textarea>
          <div class="invalid-feedback" th:errors="*{contenido}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Enviar</button>
      </form>
    </th:block>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
