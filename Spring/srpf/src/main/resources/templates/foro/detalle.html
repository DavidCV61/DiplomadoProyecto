<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Foro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
  <div th:replace="~{fragments/menu :: menu('foro')}"></div>

  <main class="container mb-5" style="max-width: 800px;">
    <a th:href="@{/foro}" class="small text-decoration-none">&larr; Volver al foro</a>
    <div class="alert alert-success mt-2" th:if="${mensaje}" th:text="${mensaje}"></div>

    <h1 class="mt-2" th:text="${publicacion.titulo}">Titulo</h1>
    <p class="text-muted small">
      por <span th:text="${publicacion.autorNombre}">Autor</span>
      &middot; <span th:text="${#temporals.format(publicacion.fecha, 'dd/MM/yyyy HH:mm')}">fecha</span>
    </p>
    <div class="card mb-4">
      <div class="card-body" style="white-space: pre-wrap;" th:text="${publicacion.contenido}">Contenido</div>
    </div>

    <h5><span th:text="${#lists.size(publicacion.respuestas)}">0</span> respuestas</h5>
    <div class="card mb-2" th:each="r : ${publicacion.respuestas}">
      <div class="card-body">
        <div class="small text-muted mb-1">
          <strong th:text="${r.autorNombre}">Autor</strong>
          &middot; <span th:text="${#temporals.format(r.fecha, 'dd/MM/yyyy HH:mm')}">fecha</span>
        </div>
        <div style="white-space: pre-wrap;" th:text="${r.contenido}">Contenido</div>
      </div>
    </div>

    <h5 class="mt-4">Responder</h5>
    <form th:action="@{/foro/{id}/responder(id=${publicacion.id})}" th:object="${respuesta}"
      method="post" novalidate>
      <div class="mb-3">
        <textarea id="contenido" th:field="*{contenido}" rows="4" class="form-control"
          th:classappend="${#fields.hasErrors('contenido')} ? 'is-invalid'"></textarea>
        <div class="invalid-feedback" th:errors="*{contenido}"></div>
      </div>
      <button type="submit" class="btn btn-primary">Responder</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
