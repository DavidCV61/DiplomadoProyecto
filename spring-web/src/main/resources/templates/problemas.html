<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8">
  <title>SRPF - Problemas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
  <div th:replace="~{fragments/menu :: menu('problemas')}"></div>

  <main class="container mb-5">
    <h1>Problemas</h1>
    <div class="alert alert-success" th:if="${guardado}">Problema guardado correctamente.</div>
    <div class="alert alert-success" th:if="${actualizado}">Problema actualizado correctamente.</div>
    <div class="alert alert-warning" th:if="${eliminado}">Problema eliminado correctamente.</div>
    <p class="text-muted">Da clic en un problema para resolverlo, o gestiona el catálogo.</p>
    <a th:href="@{/problemas/nuevo}" class="btn btn-success mb-3">Nuevo Problema</a>
    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>Título</th>
          <th>Tema</th>
          <th>Nivel</th>
          <th>Operaciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="problema : ${problemas}">
          <td>
            <a th:href="@{/problemas/resolver/{id}(id=${problema.id})}" class="fw-bold text-decoration-none"
               th:text="${problema.titulo}">Título</a>
          </td>
          <td><span class="badge bg-info text-dark" th:text="${problema.tema}">Tema</span></td>
          <td><span class="badge bg-secondary" th:text="${problema.nivel}">Nivel</span></td>
          <td>
            <a th:href="@{/problemas/resolver/{id}(id=${problema.id})}" class="btn btn-primary btn-sm">Resolver</a>
            <a th:href="@{/problemas/editar/{id}(id=${problema.id})}" class="btn btn-warning btn-sm">Editar</a>
            <a th:href="@{/problemas/eliminar/{id}(id=${problema.id})}" class="btn btn-danger btn-sm"
               onclick="return confirm('¿Eliminar este problema?');">Eliminar</a>
          </td>
        </tr>
      </tbody>
    </table>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
