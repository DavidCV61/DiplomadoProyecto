<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>SRPF - Ranking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/menu :: menu('ranking')}"></div>

<main class="container mb-5">
    <h1>Ranking</h1>
    <p class="text-muted">Esta es la página de Ranking: usuarios ordenados por puntuación ELO.</p>
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Username</th>
            <th>Rol</th>
            <th>Puntuación ELO</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="usuario, iStat : ${usuarios}">
            <td th:text="${iStat.count}">1</td>
            <td th:text="${usuario.nombre}">Nombre</td>
            <td th:text="${usuario.username}">username</td>
            <td><span class="badge bg-dark" th:text="${usuario.rol}">USER</span></td>
            <td class="fw-bold" th:text="${usuario.puntuacionElo}">1000</td>
        </tr>
        </tbody>
    </table>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
