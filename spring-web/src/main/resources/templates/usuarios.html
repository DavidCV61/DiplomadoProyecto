<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>SRPF - Usuarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/menu :: menu('usuarios')}"></div>

<main class="container mb-5">
    <h1>Usuarios</h1>
    <div class="alert alert-success" th:if="${actualizado}">Usuario actualizado correctamente.</div>
    <div class="alert alert-warning" th:if="${eliminado}">Usuario eliminado correctamente.</div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr><th>Nombre</th><th>Username</th><th>Email</th><th>Rol</th><th>ELO</th><th>Operaciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.nombre}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.rol}"></td>
            <td th:text="${u.puntuacionElo}"></td>
            <td>
                <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Eliminar este usuario?');">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
