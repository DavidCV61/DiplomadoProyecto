<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>SRPF - Nueva Competencia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/menu :: menu('competencias')}"></div>

<main class="container mb-5">
    <h1>Nueva Competencia</h1>
    <form th:action="@{/competencias/guardar}" th:object="${competenciaDTO}" method="post">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}">
            <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" th:field="*{descripcion}"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Fecha de inicio</label>
            <input type="datetime-local" class="form-control" th:field="*{fechaInicio}">
            <div class="text-danger small" th:if="${#fields.hasErrors('fechaInicio')}" th:errors="*{fechaInicio}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Duración (minutos)</label>
            <input type="number" class="form-control" th:field="*{duracionMinutos}">
            <div class="text-danger small" th:if="${#fields.hasErrors('duracionMinutos')}" th:errors="*{duracionMinutos}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Estado</label>
            <select class="form-select" th:field="*{estado}">
                <option value="">-- Selecciona --</option>
                <option value="PROGRAMADA">PROGRAMADA</option>
                <option value="EN_CURSO">EN_CURSO</option>
                <option value="FINALIZADA">FINALIZADA</option>
                <option value="CANCELADA">CANCELADA</option>
            </select>
            <div class="text-danger small" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Creador</label>
            <select class="form-select" th:field="*{creadorId}">
                <option value="">-- Selecciona --</option>
                <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombre}"></option>
            </select>
            <div class="text-danger small" th:if="${#fields.hasErrors('creadorId')}" th:errors="*{creadorId}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Crear competencia</button>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
