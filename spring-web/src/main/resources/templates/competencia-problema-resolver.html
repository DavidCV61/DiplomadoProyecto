<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>SRPF - Resolver Problema de Competencia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/menu :: menu('competencias')}"></div>

<main class="container mb-5">
    <a th:href="@{/competencias/{id}(id=${competencia.id})}" class="btn btn-outline-secondary btn-sm mb-3">&larr; Volver a la competencia</a>
    <p class="text-muted mb-1">Competencia: <strong th:text="${competencia.nombre}"></strong></p>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h1 class="card-title" th:text="${problema.titulo}">Título</h1>
            <span class="badge bg-info text-dark" th:text="${problema.tema}">Tema</span>
            <span class="badge bg-secondary" th:text="${problema.nivel}">Nivel</span>
            <p class="card-text mt-3" th:text="${problema.enunciado}">Enunciado</p>
        </div>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">Enviar respuesta</h5>
            <form th:action="@{/competencias/{idc}/problemas/{idp}/enviar(idc=${competencia.id},idp=${problema.id})}"
                  th:object="${intentoDTO}" method="post">
                <input type="hidden" th:field="*{idProblema}"/>

                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <select class="form-select" th:field="*{idUsuario}">
                        <option value="">-- Selecciona --</option>
                        <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombre}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('idUsuario')}" th:errors="*{idUsuario}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tu respuesta (numérica)</label>
                    <input type="text" class="form-control" th:field="*{respuestaEnviada}" placeholder="Ej. 9.8">
                    <div class="text-danger small" th:if="${#fields.hasErrors('respuestaEnviada')}" th:errors="*{respuestaEnviada}"></div>
                </div>

                <button type="submit" class="btn btn-primary">Enviar respuesta</button>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
