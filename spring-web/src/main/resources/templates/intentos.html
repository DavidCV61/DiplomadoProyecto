<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>SRPF - Historial de Intentos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="~{fragments/menu :: menu('intentos')}"></div>

<main class="container mb-5">
    <h1 class="mt-4">Historial de Intentos</h1>
    <p class="text-muted">Registro de todas las resoluciones de problemas realizadas por los usuarios.</p>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Usuario</th>
                <th>Problema</th>
                <th>Respuesta</th>
                <th>Resultado</th>
                <th>Fecha / Hora</th>
                <th>Tipo</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="intento, iStat : ${intentos}">
                <td th:text="${iStat.count}">1</td>
                <td>
                    <span th:text="${intento.usuario.nombre}">Nombre</span>
                    <br>
                    <small class="text-muted" th:text="'@' + ${intento.usuario.username}">@username</small>
                </td>
                <td th:text="${intento.problema.titulo}">Título del problema</td>
                <td th:text="${intento.respuestaEnviada}">0.000000</td>
                <td>
                    <span class="badge"
                          th:classappend="${intento.resultado == 'CORRECTO'} ? 'bg-success' : 'bg-danger'"
                          th:text="${intento.resultado}">CORRECTO</span>
                </td>
                <td th:text="${#temporals.format(intento.fechaHora, 'dd/MM/yyyy HH:mm')}">26/08/2026 14:30</td>
                <td>
                    <span class="badge bg-secondary"
                          th:text="${intento.tipo}">GIMNASIO</span>
                </td>
            </tr>
            <tr th:if="${intentos.isEmpty()}">
                <td colspan="7" class="text-center text-muted">No hay intentos registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3">
        <a th:href="@{/problemas}" class="btn btn-outline-secondary">← Volver a problemas</a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
