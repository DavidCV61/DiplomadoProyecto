<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>SRPF - Competencias</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/menu :: menu('competencias')}"></div>

<main class="container mb-5">
    <h1>Competencias</h1>
    <p class="text-muted">Gestiona el catálogo de competencias.</p>
    <a th:href="@{/competencias/nueva}" class="btn btn-success mb-3">Nueva Competencia</a>

    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Fecha Inicio</th>
                <th>Duración</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="competencia : ${competencias}">
                <td class="fw-bold" th:text="${competencia.nombre}">Nombre</td>
                <td th:text="${competencia.descripcion}">Descripción</td>
                <td th:text="${competencia.fechaInicio}">Fecha</td>
                <td><span th:text="${competencia.duracionMinutos}">0</span> min</td>
                <td>
                    <span class="badge bg-primary" th:text="${competencia.estado}">Estado</span>
                </td>
                <td>
                    <button type="button" class="btn btn-primary btn-sm disabled" aria-disabled="true">Inscribirse</button>
                    <a th:href="@{/competencias/{id}(id=${competencia.id})}" class="btn btn-warning btn-sm">Editar</a>
                </td>
            </tr>
        </tbody>
    </table>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
