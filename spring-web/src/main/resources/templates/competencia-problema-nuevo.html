<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>SRPF - Nuevo Problema para Competencia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/menu :: menu('competencias')}"></div>

<main class="container mb-5">
    <a th:href="@{/competencias/{id}(id=${competencia.id})}" class="btn btn-outline-secondary btn-sm mb-3">&larr; Volver a la competencia</a>
    <h1>Nuevo problema para: <span th:text="${competencia.nombre}"></span></h1>

    <form th:action="@{/competencias/{id}/problemas/crear(id=${competencia.id})}" th:object="${problemaDTO}" method="post">
        <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" class="form-control" th:field="*{titulo}">
            <div class="text-danger small" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Enunciado</label>
            <textarea class="form-control" th:field="*{enunciado}"></textarea>
            <div class="text-danger small" th:if="${#fields.hasErrors('enunciado')}" th:errors="*{enunciado}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Tema</label>
            <select class="form-select" th:field="*{tema}">
                <option value="">-- Selecciona --</option>
                <option value="Mecánica">Mecánica</option>
                <option value="Termodinámica">Termodinámica</option>
                <option value="Electromagnetismo">Electromagnetismo</option>
                <option value="Óptica">Óptica</option>
                <option value="Física Moderna">Física Moderna</option>
                <option value="Ondas">Ondas</option>
                <option value="Otros">Otros</option>
            </select>
            <div class="text-danger small" th:if="${#fields.hasErrors('tema')}" th:errors="*{tema}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Nivel</label>
            <select class="form-select" th:field="*{nivel}">
                <option value="">-- Selecciona --</option>
                <option value="Básico">Básico</option>
                <option value="Intermedio">Intermedio</option>
                <option value="Avanzado">Avanzado</option>
                <option value="Experto">Experto</option>
            </select>
            <div class="text-danger small" th:if="${#fields.hasErrors('nivel')}" th:errors="*{nivel}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Resultado esperado</label>
            <input type="text" class="form-control" th:field="*{resultadoEsperado}">
            <div class="text-danger small" th:if="${#fields.hasErrors('resultadoEsperado')}" th:errors="*{resultadoEsperado}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Margen de tolerancia</label>
            <input type="text" class="form-control" th:field="*{margenTolerancia}">
            <div class="text-danger small" th:if="${#fields.hasErrors('margenTolerancia')}" th:errors="*{margenTolerancia}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Crear y asignar a la competencia</button>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
