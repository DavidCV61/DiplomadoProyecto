<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>SRPF - Foro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/menu :: menu('foro')}"></div>

<main class="container mb-5">
    <h1>Foro</h1>
    <div class="alert alert-success" th:if="${publicado}">¡Publicación creada correctamente!</div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title mb-3">Nueva publicación</h5>
            <form th:action="@{/foro/publicar}" th:object="${publicacionDTO}" method="post">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <select class="form-select" th:field="*{idUsuario}">
                        <option value="">-- Selecciona --</option>
                        <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombre}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('idUsuario')}" th:errors="*{idUsuario}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input type="text" class="form-control" th:field="*{titulo}">
                    <div class="text-danger small" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contenido</label>
                    <textarea class="form-control" th:field="*{contenido}"></textarea>
                    <div class="text-danger small" th:if="${#fields.hasErrors('contenido')}" th:errors="*{contenido}"></div>
                </div>
                <button type="submit" class="btn btn-primary">Publicar</button>
            </form>
        </div>
    </div>

    <h4>Publicaciones</h4>
    <div class="card shadow-sm mb-3" th:each="publicacion : ${publicaciones}">
        <div class="card-body">
            <h5 class="card-title" th:text="${publicacion.titulo}">Título</h5>
            <h6 class="card-subtitle mb-2 text-muted">
                Por <span th:text="${publicacion.usuario.nombre}">Autor</span> &mdash;
                <span th:text="${publicacion.fechaPublicacion}">fecha</span>
            </h6>
            <p class="card-text" th:text="${publicacion.contenido}">Contenido</p>
        </div>
    </div>

    <div class="alert alert-secondary" th:if="${#lists.isEmpty(publicaciones)}">
        Todavía no hay publicaciones en el foro.
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
